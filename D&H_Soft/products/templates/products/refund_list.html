<!-- refund_list.html -->
<table class="table">
  <thead><tr><th>Date</th><th>Product</th><th>Qty</th><th>Reason</th></tr></thead>
  <tbody>
    {% for r in refunds %}
    <tr>
      <td>{{ r.date }}</td>
      <td>{{ r.product.name }}</td>
      <td>{{ r.quantity }}</td>
      <td>{{ r.reason }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
