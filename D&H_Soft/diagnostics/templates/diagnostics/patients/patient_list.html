{% extends 'accounts/base.html' %}
{% block content %}
<h2>Patient List</h2>
<a href="{% url 'diagnostics:patient_create' %}" class="btn btn-primary mb-3">Add New Patient</a>
<table class="table table-bordered">
  <thead>
    <tr><th>Code</th><th>Name</th><th>Age</th><th>Gender</th><th>Mobile</th></tr>
  </thead>
  <tbody>
    {% for patient in patients %}
    <tr>
      <td>{{ patient.patient_code }}</td>
      <td><a href="{% url 'diagnostics:patient_detail' patient.pk %}">{{ patient.name }}</a></td>
      <td>{{ patient.age }}</td>
      <td>{{ patient.get_gender_display }}</td>
      <td>{{ patient.mobile }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
