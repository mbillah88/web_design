<aside id="sidebar" class="sidebar bg-light border-end px-2">
  <div class="p-3">
    <!-- ✅ Collapse toggle only for desktop -->
    <div class="d-flex justify-content-between align-items-center mb-3"> 
      <span class="fs-6 fw-bold text-primary sidebar-title">
        🔧 <small class="text-muted">{{ user_role }}</small>
      </span>
      <button id="sidebarToggle" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-layout-sidebar-inset"></i>
        <span class="sidebar-text"></span>
      </button>
    </div>


    <hr class="w-100">

    <ul class="nav flex-column">
      {% for group in sidebar_groups %}
        {% if group.modules|length > 1 %}
          <!-- 🔸 Accordion Group -->
          <div class="accordion mb-2" id="accordion{{ forloop.counter }}">
            <div class="accordion-item border-0">
              <h2 class="accordion-header">
                <button class="accordion-button {% if group.active %} {% else %}collapsed{% endif %} fw-bold bg-light text-dark d-flex align-items-center"
                        type="button" data-bs-toggle="collapse" data-bs-target="#collapse{{ forloop.counter }}">
                  <i class="{{ group.icon }} me-2"></i>
                  <span class="sidebar-text">{{ group.name }}</span>
                </button>
              </h2>
              <div id="collapse{{ forloop.counter }}" class="accordion-collapse collapse {% if group.active %}show{% endif %}">
                <div class="accordion-body px-0">
                  <ul class="nav flex-column">
                    {% for module in group.modules %}
                      <li class="nav-item w-100">
                        <a href="{% url module.url_name %}" class="nav-link
                            {% if module.is_active %}
                              active fw-bold bg-primary-subtle text-primary
                            {% endif %}">
                          <i class="{{ module.icon }} me-2"></i>
                          <span class="sidebar-text">{{ module.name }}</span>
                        </a>
                      </li>
                    {% endfor %}
                  </ul>
                </div>
              </div>
            </div>
          </div>
        {% else %}
          <!-- 🔹 Single Module → Direct Link -->
          {% for module in group.modules %}
            <li class="nav-item w-100">
              <a href="{% url module.url_name %}" class="nav-link d-flex align-items-center
                  {% if module.is_active %}
                    active fw-bold bg-primary-subtle text-primary
                  {% endif %}" data-bs-toggle="tooltip" title="{{ module.name }}">
                <i class="{{ module.icon }} me-2"></i>
                <span class="sidebar-text">{{ module.name }}</span>
              </a>
            </li>
          {% endfor %}
        {% endif %}
      {% endfor %}
    </ul>

  </div>
</aside>
