<div class="modal fade" id="userModal" tabindex="-1" aria-labelledby="userModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content shadow-sm border-0 rounded-3">
      <form id="userForm" class="user-form" data-user-id="">
        {% csrf_token %}
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title fw-bold" id="modalTitle">➕ নতুন ইউজার</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">ইউজারনেম</label>
              <input type="text" name="username" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">ইমেইল</label>
              <input type="email" name="email" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">রোল</label>
              <select name="role" class="form-select" required>
                {% for role in roles %}
                  <option value="{{ role.id }}">{{ role.name }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">পাসওয়ার্ড</label>
              <input type="password" name="password" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">পাসওয়ার্ড নিশ্চিত করুন</label>
              <input type="password" name="confirm_password" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label d-block">স্ট্যাটাস</label>
              <div class="form-check form-check-inline">
                <input type="checkbox" name="is_active" class="form-check-input" id="activeCheck">
                <label class="form-check-label" for="activeCheck">অ্যাক্টিভ</label>
              </div>
              <div class="form-check form-check-inline">
                <input type="checkbox" name="is_staff" class="form-check-input" id="staffCheck">
                <label class="form-check-label" for="staffCheck">স্টাফ</label>
              </div>
              <div class="form-check form-check-inline">
                <input type="checkbox" name="is_superuser" class="form-check-input" id="superCheck">
                <label class="form-check-label" for="superCheck">সুপারইউজার</label>
              </div>
            </div>
          </div>
        </div>

        <div class="modal-footer bg-light">
          <button type="submit" class="btn btn-success px-4">✅ সংরক্ষণ করুন</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">❌ বাতিল</button>
        </div>
      </form>
    </div>
  </div>
</div>
