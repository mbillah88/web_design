{% load static %}
<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Accounts Panel{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{% static 'accounts/css/theme.css' %}" rel="stylesheet">
</head>
<body>
  {% include 'accounts/header.html' %}

  <div class="container-fluid">
    <div class="row flex-nowrap">
      {% include 'accounts/sidebar.html' %}
      <main class="col py-3">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <!-- ✅ Toast Container -->
  <div class="toast-container position-fixed top-0 end-0 p-3">
    <div id="liveToast" class="toast" role="alert">
      <div class="toast-header bg-success text-white">
        <strong class="me-auto">Status</strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
      </div>
      <div class="toast-body" id="toastBody">Updated!</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'accounts/js/custom.js' %}"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const sidebar = document.getElementById('sidebar');
      const toggleMobile = document.getElementById('sidebarToggleMobile');

      // Toggle sidebar on mobile
      if (toggleMobile) {
        toggleMobile.addEventListener('click', function (e) {
          e.stopPropagation(); // Prevent immediate close
          sidebar.classList.toggle('show');
        });
      }

      // Hide sidebar when clicking outside
      document.body.addEventListener('click', function (e) {
        if (window.innerWidth < 768) {
          const isClickInsideSidebar = sidebar.contains(e.target);
          const isToggleButton = toggleMobile.contains(e.target);

          if (!isClickInsideSidebar && !isToggleButton) {
            sidebar.classList.remove('show');
          }
        }
      });
    });

    document.addEventListener('DOMContentLoaded', function () {
      const themeToggle = document.getElementById('themeToggle');
      const root = document.documentElement;

      const savedTheme = localStorage.getItem('theme') || 'light';
      root.setAttribute('data-theme', savedTheme);

      themeToggle.addEventListener('click', function () {
        const current = root.getAttribute('data-theme');
        const next = current === 'light' ? 'dark' : 'light';
        root.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
      });
    });

    // Function to show toast notifications
        function showToast(message, type = 'success') {
          const toastEl = document.getElementById('liveToast');
          const toastMsg = document.getElementById('toastMessage');
          toastMsg.innerText = message;
          toastEl.className = `toast align-items-center text-bg-${type} border-0`;
          const toast = new bootstrap.Toast(toastEl);
          toast.show();
        }
  </script>
  {% block scripts %}
  {% endblock %}
</body>
</html>
