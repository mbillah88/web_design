<!-- accounts/modals/add_user.html -->
<div class="modal fade" id="userModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <form id="userForm" method="POST">
        {% csrf_token %}
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">➕ নতুন ইউজার</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body row g-3">
          <div class="col-md-6">
            <label class="form-label">ইউজারনেম</label>
            <input type="text" name="username" class="form-control" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">ইমেইল</label>
            <input type="email" name="email" class="form-control" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">🔐 পাসওয়ার্ড</label>
            <input type="password" name="password" class="form-control">
          </div>

          <div class="col-md-6">
            <label class="form-label">🔁 পুনরায় পাসওয়ার্ড</label>
            <input type="password" name="confirm_password" class="form-control">
          </div>

          <div class="col-md-6">
            <label class="form-label">🎭 রোল</label>
            <select name="role" class="form-select" required>
              {% for role in roles %}
                <option value="{{ role.id }}">{{ role.name }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="col-md-6 d-flex flex-wrap gap-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="is_active" id="is_active">
              <label class="form-check-label" for="is_active">✅ সক্রিয়</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="is_staff" id="is_staff">
              <label class="form-check-label" for="is_staff">🛠️ স্টাফ</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="is_superuser" id="is_superuser">
              <label class="form-check-label" for="is_superuser">👑 সুপারইউজার</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="is_protected" id="is_protected">
              <label class="form-check-label" for="is_protected">🛡️ প্রোটেক্টেড</label>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="submit" class="btn btn-success">💾 সংরক্ষণ করুন</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">❌ বাতিল</button>
        </div>
      </form>
    </div>
  </div>
</div>
