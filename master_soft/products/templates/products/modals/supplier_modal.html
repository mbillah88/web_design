<div class="modal fade" id="supplierModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">➕ Add Supplier</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <div class="row g-3">
          <!-- 🔹 Left: Supplier List -->
          <div class="col-md-6">
            <label>Search Existing Supplier</label>
            <input type="text" id="supplierSearchModal" class="form-control" placeholder="Type name, mobile or company">
            <div id="supplierListModal" class="list-group mt-2"></div>
          </div>

          <!-- 🔹 Right: Supplier Form -->
          <div class="col-md-6">
            <form id="supplierForm">
              <label>Name</label>
              <input type="text" name="name" class="form-control mb-2" required>

              <label>Company</label>
              <input type="text" name="company_name" class="form-control mb-2">

              <label>Mobile</label>
              <input type="text" name="mobile" class="form-control mb-2">

              <label>Email</label>
              <input type="email" name="email" class="form-control mb-2">

              <label>Address</label>
              <textarea name="address" class="form-control mb-2" rows="2"></textarea>

              <button type="submit" class="btn btn-success w-100 mt-2">✅ Save Supplier</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
