<form id="warrantyForm">
  {% csrf_token %}
  <input type="hidden" id="warrantyId" name="id">

  <div class="row g-3">
    <div class="col-md-6">
      <label for="warrantyName" class="form-label">ওয়ারেন্টির নাম</label>
      <input type="text" id="warrantyName" name="name" class="form-control" required>
    </div>

    <div class="col-md-6">
      <label for="warrantyType" class="form-label">ধরন</label>
      <input type="text" id="warrantyType" name="type" class="form-control" placeholder="যেমনঃ Manufacturer" required>
    </div>

    <div class="col-md-6">
      <label for="warrantyDuration" class="form-label">মেয়াদ (মাস)</label>
      <input type="number" id="warrantyDuration" name="duration_months" class="form-control" required>
    </div>

    <div class="col-md-6">
      <label for="warrantyStatus" class="form-label">অবস্থা</label>
      <select id="warrantyStatus" name="is_active" class="form-select">
        <option value="true">সক্রিয়</option>
        <option value="false">নিষ্ক্রিয়</option>
      </select>
    </div>

    <div class="col-12">
      <label for="warrantyTerms" class="form-label">শর্তাবলী</label>
      <textarea id="warrantyTerms" name="terms" class="form-control" rows="3" placeholder="ওয়ারেন্টির শর্তাবলী লিখুন"></textarea>
    </div>
  </div>

  <div class="mt-3 d-flex justify-content-between">
    <button type="submit" class="btn btn-success">💾 সেভ করুন</button>
    <button type="button" id="deleteWarrantyBtn" class="btn btn-danger d-none">🗑️ ডিলিট</button>
  </div>
</form>
