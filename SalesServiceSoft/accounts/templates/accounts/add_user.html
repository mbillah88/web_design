{% extends 'base_software.html' %}
{% block title %}নতুন ইউজার তৈরি{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
  <div class="row justify-content-center">
    <div class="col-lg-10">

      <div class="card shadow-sm border-0">
        <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
          <h5 class="mb-0">➕ নতুন ইউজার তৈরি করুন</h5>
          <a href="{% url 'user_list' %}" class="btn btn-light btn-sm">🔙 ইউজার তালিকা</a>
        </div>

        <div class="card-body">
          <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="row g-3">

              <div class="col-md-6">
                <label class="form-label">ইউজারনেম</label>
                <input type="text" name="username" value="{{ form.username.value }}" class="form-control" required>
              </div>

              <div class="col-md-6">
                <label class="form-label">ইমেইল</label>
                <input type="email" name="email" value="{{ form.email.value }}" class="form-control">
              </div>

              <div class="col-md-6">
                <label class="form-label">রোল</label>
                <select name="role" class="form-select">
                  {% for val,label in form.fields.role.choices %}
                    <option value="{{ val }}" {% if form.role.value == val %}selected{% endif %}>{{ label }}</option>
                  {% endfor %}
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label">ফোন</label>
                <input type="text" name="phone" value="{{ form.phone.value }}" class="form-control">
              </div>

              <div class="col-md-12">
                <label class="form-label">ঠিকানা</label>
                <textarea name="address" class="form-control" rows="2">{{ form.address.value }}</textarea>
              </div>

              <div class="col-md-6">
                <label class="form-label">জন্ম তারিখ</label>
                <input type="date" name="date_of_birth" value="{{ form.date_of_birth.value }}" class="form-control">
              </div>

              <div class="col-md-6">
                <label class="form-label">প্রোফাইল ছবি</label>
                <input type="file" name="profile_image" class="form-control">
              </div>

              <div class="col-md-6">
                <label class="form-label">পাসওয়ার্ড</label>
                <input type="password" name="password1" class="form-control" required>
              </div>

              <div class="col-md-6">
                <label class="form-label">পুনরায় পাসওয়ার্ড</label>
                <input type="password" name="password2" class="form-control" required>
              </div>

            </div>

            <div class="mt-4 text-end">
              <button type="submit" class="btn btn-success">✅ ইউজার যুক্ত করুন</button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
