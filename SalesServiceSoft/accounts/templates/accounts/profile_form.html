{% extends 'base_software.html' %}
{% block title %}ড্যাশবোর্ড{% endblock %}
{% block content %}
<h4>✏️ প্রোফাইল সম্পাদনা</h4>
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label">নামের প্রথম অংশ</label>
      <input type="text" name="first_name" value="{{ user.first_name }}" class="form-control">
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">নামের শেষ অংশ</label>
      <input type="text" name="last_name" value="{{ user.last_name }}" class="form-control">
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">ইমেইল</label>
      <input type="email" name="email" value="{{ user.email }}" class="form-control">
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">ফোন</label>
      <input type="text" name="phone" value="{{ user.phone }}" class="form-control">
    </div>
    <div class="col-md-12 mb-3">
      <label class="form-label">ঠিকানা</label>
      <textarea name="address" class="form-control">{{ user.address }}</textarea>
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">জন্ম তারিখ</label>
      <input type="date" name="date_of_birth" value="{{ user.date_of_birth }}" class="form-control">
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">প্রোফাইল ছবিs</label>
      <input type="file" name="profile_image" class="form-control">
    </div>
  </div>
  <button type="submit" class="btn btn-success">✅ সংরক্ষণ করুন</button>
</form>
{% endblock %}
