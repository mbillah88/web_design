<table class="table table-bordered text-center">
  <thead>
    <tr>
      <th>Role \ Module</th>
      {% for module in modules %}
        <th>{{ module.name }}</th>
      {% endfor %}
    </tr>
  </thead>
  <tbody>
    {% for role in roles %}
      <tr>
        <td>{{ role.name }}</td>
        {% for module in modules %}
          {% with key=role.id|stringformat:"s"|add:module.id|stringformat:"s" %}
            <td>
              <button class="btn btn-sm {% if matrix|default_if_none:''|dict_get:(role.id,module.id) %}btn-success{% else %}btn-secondary{% endif %}"
                      onclick="togglePermission({{ role.id }}, {{ module.id }}, this)">
                {% if matrix|default_if_none:''|dict_get:(role.id,module.id) %}✔{% else %}✖{% endif %}
              </button>
            </td>
          {% endwith %}
        {% endfor %}
      </tr>
    {% endfor %}
  </tbody>
</table>
<script>
function togglePermission(roleId, moduleId, btn) {
  fetch("{% url 'toggle_permission' %}", {
    method: 'POST',
    headers: {
      'X-CSRFToken': '{{ csrf_token }}',
      'Content-Type': 'application/x-www-form-urlencoded'
    },
    body: `role_id=${roleId}&module_id=${moduleId}`
  })
  .then(res => res.json())
  .then(data => {
    if (data.status === 'success') {
      btn.classList.toggle('btn-success', data.can_access);
      btn.classList.toggle('btn-secondary', !data.can_access);
      btn.innerText = data.can_access ? '✔' : '✖';
      showToast("Permission updated", true);
    } else {
      showToast("Error: " + data.message, false);
    }
  });
}
</script>
<div class="toast-container position-fixed top-0 end-0 p-3">
  <div id="liveToast" class="toast" role="alert">
    <div class="toast-header bg-success text-white">
      <strong class="me-auto">Status</strong>
      <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
    </div>
    <div class="toast-body" id="toastBody">Updated!</div>
  </div>
</div>

<script>
function showToast(message, isSuccess = true) {
  const toastEl = document.getElementById('liveToast');
  const toastBody = document.getElementById('toastBody');
  toastBody.innerText = message;
  toastEl.querySelector('.toast-header').classList.toggle('bg-success', isSuccess);
  toastEl.querySelector('.toast-header').classList.toggle('bg-danger', !isSuccess);
  new bootstrap.Toast(toastEl).show();
}
</script>
